name: Build Miwaku APK

on:
  push:
    paths:
      - 'luscious-downloader/android-app/**'
      - '.github/workflows/luscious-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luscious-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Automated tests run first; a failing test stops the APK from being published.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luscious-downloader/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luscious-downloader/android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and sync web app
        run: |
          npm install --no-audit --no-fund
          echo '{"build": ${{ github.run_number }}}' > www/build.json
          npx cap sync android

      - name: Build APK
        working-directory: luscious-downloader/android-app/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Miwaku.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Miwaku-apk
          path: Miwaku.apk

      # Publishes the APK at a fixed link you can open on your phone:
      # https://github.com/<owner>/<repo>/releases/download/miwaku-latest/Miwaku.apk
      - name: Publish to the "miwaku-latest" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the latest changes to the app.
          {
            echo "Latest Android build of Miwaku (build ${{ github.run_number }}). Download Miwaku.apk on your phone and open it to install."
            echo
            echo "### Recent changes"
            git log -15 --pretty='- %s' -- luscious-downloader/android-app .github/workflows
          } > notes.md
          gh release delete miwaku-latest --yes --cleanup-tag || true
          gh release create miwaku-latest Miwaku.apk \
            --target "$GITHUB_SHA" \
            --title "Miwaku for Android (build ${{ github.run_number }})" \
            --notes-file notes.md
