<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luscious Downloader</title>
<style>
  :root { --bg:#111214; --panel:#1b1d21; --line:#2a2d33; --text:#e9e9ec; --muted:#9a9ca3; --accent:#e0457b; --accent2:#ff6b9d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(17,18,20,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:10px 16px; }
  .bar { display:flex; gap:8px; max-width:1200px; margin:0 auto; align-items:center; }
  .logo { font-weight:700; color:var(--accent2); cursor:pointer; white-space:nowrap; }
  form { display:flex; gap:8px; flex:1; min-width:0; }
  input, select, button, .btn { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:9px 12px; }
  input { flex:1; min-width:0; }
  button, .btn { cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .primary:hover { background:var(--accent2); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .card { background:var(--panel); border-radius:10px; overflow:hidden; cursor:pointer; border:1px solid var(--line); }
  .card img, .thumb img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#222; }
  .card .t { padding:8px; font-size:13px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .n { padding:0 8px 8px; font-size:12px; color:var(--muted); }
  .thumb { border-radius:8px; overflow:hidden; cursor:zoom-in; position:relative; }
  .thumb span { position:absolute; left:4px; bottom:4px; background:rgba(0,0,0,.6); font-size:11px; padding:1px 6px; border-radius:5px; }
  .muted { color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  .tag { font-size:12px; background:#26282e; border-radius:20px; padding:3px 10px; color:var(--muted); cursor:pointer; }
  .album-head { display:flex; gap:16px; flex-wrap:wrap; }
  .album-head img { width:160px; border-radius:10px; }
  .album-head h1 { font-size:20px; margin:0 0 6px; }
  .center { text-align:center; padding:30px 0; }
  .err { background:#3a1d24; border:1px solid #6b2a39; padding:12px; border-radius:8px; }
  .spinner { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:10; display:none; align-items:center; justify-content:center; touch-action:pan-y; }
  #viewer.open { display:flex; }
  #viewer img, #viewer video { max-width:100vw; max-height:100vh; object-fit:contain; }
  #viewer .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.08); border:none; font-size:28px; padding:16px 12px; }
  #viewer .prev { left:6px; } #viewer .next { right:6px; }
  #viewer .top { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:linear-gradient(rgba(0,0,0,.7),transparent); }
  #viewer .top button, #viewer .top a { background:rgba(255,255,255,.1); border:none; }
  @media (max-width:520px) { .logo { display:none; } .grid { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; } .album-head img { width:110px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo" onclick="location.hash=''">Luscious DL</span>
    <form id="search">
      <input id="q" type="search" placeholder="Search, or paste an album link…" autocomplete="off">
      <select id="sort" title="Sort">
        <option value="">Best</option>
        <option value="date_trending">Trending</option>
        <option value="date_newest">Newest</option>
        <option value="rating_all_time">Top rated</option>
      </select>
      <button class="primary" type="submit">Go</button>
    </form>
  </div>
</header>
<main id="app"></main>

<div id="viewer">
  <div class="top">
    <span id="vcount" class="muted"></span>
    <span style="display:flex;gap:8px">
      <a id="vsave" class="btn" target="_blank" rel="noopener">Open</a>
      <button onclick="closeViewer()">✕</button>
    </span>
  </div>
  <button class="nav prev" onclick="step(-1)">‹</button>
  <div id="vmedia"></div>
  <button class="nav next" onclick="step(1)">›</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const img = (u) => u ? '/img?u=' + encodeURIComponent(u) : '';
const looksLikeAlbum = (s) => /^\d+$/.test(s.trim()) || /luscious\.net\/.*(albums?\/|_id_)/i.test(s);

async function api(path) {
  const r = await fetch(path);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')');
  return j;
}
const loading = () => (app.innerHTML = '<div class="center"><div class="spinner"></div></div>');
const showError = (e) => (app.innerHTML = `<div class="err">${esc(e.message || e)}</div>`);

$('#search').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('#q').value.trim();
  if (looksLikeAlbum(v)) location.hash = '#/album/' + encodeURIComponent(v);
  else location.hash = '#/search/' + encodeURIComponent(v) + '/' + ($('#sort').value || '');
});

// ---------- Search ----------
let searchState = null;
async function renderSearch(q, sort) {
  searchState = { q, sort, page: 1, items: [], hasNext: false };
  $('#q').value = q; $('#sort').value = sort;
  loading();
  try { await loadPage(); } catch (e) { showError(e); }
}
async function loadPage() {
  const s = searchState;
  const res = await api(`/api/search?q=${encodeURIComponent(s.q)}&sort=${s.sort}&page=${s.page}`);
  if (s !== searchState) return;
  s.items.push(...res.items);
  s.hasNext = res.info?.has_next_page;
  const heading = s.q ? `Results for “${esc(s.q)}”` : 'Trending albums';
  const total = res.info?.total_items != null ? ` <span class="muted">(${res.info.total_items})</span>` : '';
  app.innerHTML = `<h2 style="margin:4px 0 14px;font-size:18px">${heading}${total}</h2>` +
    (s.items.length ? `<div class="grid">${s.items.map(card).join('')}</div>` : '<p class="muted">No albums found.</p>') +
    (s.hasNext ? '<div class="center"><button id="more">Load more</button></div>' : '');
  $('#more')?.addEventListener('click', async (e) => {
    e.target.disabled = true; e.target.textContent = 'Loading…';
    s.page++;
    try { await loadPage(); } catch (err) { e.target.textContent = err.message; }
  });
}
function card(a) {
  return `<div class="card" onclick="location.hash='#/album/${a.id}'">
    <img loading="lazy" src="${img(a.cover)}" alt="">
    <div class="t">${esc(a.title)}</div>
    <div class="n">${a.pictures} pics${a.animated ? ` · ${a.animated} animated` : ''}</div>
  </div>`;
}

// ---------- Album ----------
let current = null;
async function renderAlbum(ref) {
  loading();
  try {
    const { album, pictures } = await api('/api/album?url=' + encodeURIComponent(ref));
    current = { album, pictures };
    const tags = [...album.genres, ...album.tags].slice(0, 30);
    app.innerHTML = `
      <div class="album-head">
        <img src="${img(album.cover)}" alt="">
        <div style="flex:1;min-width:200px">
          <h1>${esc(album.title)}</h1>
          <div class="muted">${pictures.length} files${album.author ? ' · by ' + esc(album.author) : ''}${album.language ? ' · ' + esc(album.language) : ''}</div>
          <div class="row">
            <a class="btn primary" href="/download?id=${album.id}">⬇ Download ZIP</a>
            ${album.url ? `<a class="btn" href="${esc(album.url)}" target="_blank" rel="noopener">View on site</a>` : ''}
          </div>
          <div class="row">${tags.map((t) => `<span class="tag" onclick="location.hash='#/search/${encodeURIComponent(t)}/'">${esc(t)}</span>`).join('')}</div>
        </div>
      </div>
      ${album.description ? `<p class="muted">${esc(album.description)}</p>` : ''}
      <div class="grid" style="margin-top:16px">
        ${pictures.map((p, i) => `<div class="thumb" onclick="openViewer(${i})"><img loading="lazy" src="${img(p.thumb)}" alt=""><span>${i + 1}</span></div>`).join('')}
      </div>`;
    document.title = album.title + ' – Luscious DL';
  } catch (e) { showError(e); }
}

// ---------- Viewer ----------
let vi = 0;
function openViewer(i) { vi = i; $('#viewer').classList.add('open'); showPic(); }
function closeViewer() { $('#viewer').classList.remove('open'); $('#vmedia').innerHTML = ''; }
function step(d) { const n = current.pictures.length; vi = (vi + d + n) % n; showPic(); }
function showPic() {
  const p = current.pictures[vi];
  const src = img(p.original);
  $('#vmedia').innerHTML = /\.(mp4|webm)(\?|$)/i.test(p.original)
    ? `<video src="${src}" controls autoplay loop playsinline></video>` : `<img src="${src}" alt="">`;
  $('#vcount').textContent = `${vi + 1} / ${current.pictures.length}`;
  $('#vsave').href = src;
  const nxt = current.pictures[(vi + 1) % current.pictures.length];
  if (nxt) new Image().src = img(nxt.original);
}
document.addEventListener('keydown', (e) => {
  if (!$('#viewer').classList.contains('open')) return;
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Escape') closeViewer();
});
let tx = null;
$('#viewer').addEventListener('touchstart', (e) => (tx = e.touches[0].clientX), { passive: true });
$('#viewer').addEventListener('touchend', (e) => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});

// ---------- Router ----------
function route() {
  closeViewer();
  const [, kind, a = '', b = ''] = location.hash.split('/');
  document.title = 'Luscious DL';
  if (kind === 'album') renderAlbum(decodeURIComponent(a));
  else renderSearch(decodeURIComponent(a), b);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
