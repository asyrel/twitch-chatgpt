<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Miwaku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="browseHeader">
  <form id="search">
    <input id="q" type="search" placeholder="Search or paste album link…" autocomplete="off" enterkeyhint="search">
  </form>
  <div class="seg" id="sections">
    <a href="#/hentai" data-tab="hentai">Hentai</a>
    <a href="#/art" data-tab="art">Art</a>
    <a href="#/manga" data-tab="manga">Manga</a>
  </div>
</header>
<main id="app"></main>

<nav id="tabbar">
  <a href="#/feed" data-tab="feed"><i>✨</i><span>For You</span></a>
  <a href="#/browse" data-tab="browse"><i>🔍</i><span>Browse</span></a>
  <a href="#/library" data-tab="library"><i>📚</i><span>Library</span></a>
  <a href="#/settings" data-tab="settings"><i>⚙️</i><span>Settings</span></a>
</nav>

<div id="dlbar" hidden>
  <div class="dlinfo"><span id="dltext"></span><button id="dlcancel">Cancel</button></div>
  <div class="progress"><div id="dlfill"></div></div>
</div>


<script type="module" src="app.js"></script>
</body>
</html>
